apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
  labels: { app: notification-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/saajan/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8087 }
          envFrom:
            - configMapRef: { name: shared-config }
          env:
            - { name: PORT, value: "8087" }
            - { name: MONGO_DB_NAME, value: notification_db }
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: mongodb-credentials, key: uri } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
            - { name: FRONTEND_BASE_URL, value: "https://saajan.com" }
            - { name: SMS_PROVIDER, value: sslwireless }
            - name: SSLWIRELESS_API_TOKEN
              valueFrom: { secretKeyRef: { name: notification-providers, key: sslwireless-api-token } }
            - name: SSLWIRELESS_SID
              valueFrom: { secretKeyRef: { name: notification-providers, key: sslwireless-sid } }
            - name: SENDGRID_API_KEY
              valueFrom: { secretKeyRef: { name: notification-providers, key: sendgrid-api-key } }
            - name: TWILIO_ACCOUNT_SID
              valueFrom: { secretKeyRef: { name: notification-providers, key: twilio-account-sid } }
            - name: TWILIO_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: notification-providers, key: twilio-auth-token } }
            - name: FCM_SERVER_KEY
              valueFrom: { secretKeyRef: { name: notification-providers, key: fcm-server-key } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: notification-service }
  ports:
    - { name: http, port: 8087, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: notification-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: notification-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
