apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: ecommerce
  labels: { app: tenant-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: tenant-service } }
  template:
    metadata:
      labels: { app: tenant-service }
    spec:
      containers:
        - name: tenant-service
          image: ghcr.io/saajan/tenant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: shared-config }
          env:
            - { name: PORT, value: "8080" }
            - { name: DB_NAME, value: tenant_db }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
            # Object storage for branding (logo / favicon / banner) uploads.
            - name: OCI_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: access-key } }
            - name: OCI_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: secret-key } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector: { app: tenant-service }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenant-service
  namespace: ecommerce
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: tenant-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
