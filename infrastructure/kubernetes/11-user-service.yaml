apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
  labels: { app: user-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: user-service } }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: ghcr.io/saajan/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8082 }
          envFrom:
            - configMapRef: { name: shared-config }
          env:
            - { name: PORT, value: "8082" }
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: user_db }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
            - name: TWO_FACTOR_ENC_KEY
              valueFrom: { secretKeyRef: { name: two-factor-encryption-key, key: key } }
            - { name: TWO_FACTOR_ISSUER, value: Saajan }
            # Object storage for avatar uploads.
            - name: OCI_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: access-key } }
            - name: OCI_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: secret-key } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: user-service }
  ports:
    - { name: http, port: 8082, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: user-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: user-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
