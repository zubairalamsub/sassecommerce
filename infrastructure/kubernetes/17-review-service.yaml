apiVersion: apps/v1
kind: Deployment
metadata: { name: review-service, namespace: ecommerce, labels: { app: review-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: review-service } }
  template:
    metadata: { labels: { app: review-service } }
    spec:
      containers:
        - name: review-service
          image: ghcr.io/saajan/review-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8088 }]
          envFrom: [{ configMapRef: { name: shared-config } }]
          env:
            - { name: PORT, value: "8088" }
            - { name: MONGO_DB_NAME, value: review_db }
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: mongodb-credentials, key: uri } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
            # Object storage for review attachment uploads.
            - name: OCI_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: access-key } }
            - name: OCI_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: secret-key } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: review-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: review-service }
  ports: [{ name: http, port: 8088, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: review-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: review-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
