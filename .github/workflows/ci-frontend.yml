name: CI - Frontend

on:
  push:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'frontend/**'

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The ubuntu-latest runner ships Node 20+ preinstalled, which satisfies
      # Next.js/Jest. Print the version so failures are attributable; if the
      # runner default ever regresses below Node 20, pin via setup-node.
      - name: Node version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Non-blocking for now: the frontend carries ~62 pre-existing lint
      # errors, dominated by behavioral react-hooks rules
      # (set-state-in-effect, exhaustive-deps) that need careful, UI-verified
      # fixes — not a bulk sweep. Runs for visibility; flip to blocking once
      # the debt is cleared.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Blocking, unlike lint below.
      #
      # `next build` does run TypeScript, so this looks redundant — it is not.
      # Verified by putting a deliberate type error in a test file: the build
      # printed "Finished TypeScript" and still exited 0. Next only checks the
      # files reachable from what it bundles, and nothing imports a test. That
      # is how 12 TS2554 errors sat in src/__tests__/stores/reviews.test.ts
      # with CI green — stale calls to a store method that had gained a
      # required tenantId argument. At zero now, so keep it a gate.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build
        env:
          # next build only needs a syntactically valid secret present; the
          # real value is injected at runtime. 32+ bytes to satisfy startup
          # validation if any build-time code path reads it.
          JWT_SECRET: ci-build-placeholder-secret-0123456789abcdef
