name: Deploy

on:
  push:
    branches: [master]

  # Re-deploying without a code change used to be impossible: push was the
  # only trigger, and detect-changes builds only the services whose paths
  # that push touched. A bare `workflow_dispatch: {}` would inherit that
  # path filter, find nothing changed, and resolve to an empty matrix — the
  # run would go green having built and signed nothing, which is a worse
  # failure than having no manual trigger at all. So on a manual run the
  # operator names the services and the path filter is bypassed entirely
  # (see "Resolve services to build" below).
  #
  # The ref is deliberately not pinned to master: re-running against a
  # hotfix branch is a legitimate use. Note that doing so pushes that
  # branch's build to the `latest` tag, same as a master deploy would.
  workflow_dispatch:
    inputs:
      services:
        description: '"all", or a comma-separated list (e.g. order-service,user-service)'
        required: false
        default: all
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Resolve Services to Build
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Two commits is all the push path needs for its HEAD~1..HEAD diff.
          # The manual path does not diff at all, so this stays as-is.
          fetch-depth: 2

      - name: Resolve services to build
        id: changes
        env:
          # Read through env, never interpolated into the script body: this is
          # attacker-controllable text on a dispatch and `${{ }}` inside run:
          # would splice it straight into bash.
          REQUESTED_INPUT: ${{ inputs.services }}
        run: |
          # Single source of truth for what this workflow may deploy. Both
          # paths below read it, so onboarding a service is a one-line change
          # and "all" can never drift from what pushes would have built.
          # Order is load-bearing only cosmetically (it sets matrix order).
          DEPLOYABLE=(config-service shipping-service analytics-service notification-service
                      search-service review-service promotion-service order-service
                      user-service product-service tenant-service payment-service inventory-service)
          SERVICES=()

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # No diff to filter on here: HEAD~1..HEAD is whatever the last
            # push happened to touch, which has no relationship to what the
            # operator wants redeployed. Hence the explicit input.
            if [ -z "$REQUESTED_INPUT" ] || [ "$REQUESTED_INPUT" = "all" ]; then
              SERVICES=("${DEPLOYABLE[@]}")
            else
              # Service names contain no whitespace, so stripping all of it is
              # a simpler trim than a regex and makes "a, b" work.
              IFS=',' read -ra RAW <<< "$REQUESTED_INPUT"
              REQUESTED=()
              for entry in "${RAW[@]}"; do
                name=$(printf '%s' "$entry" | tr -d '[:space:]')
                [ -n "$name" ] && REQUESTED+=("$name")
              done

              # Filter DEPLOYABLE by the request rather than iterating the
              # request itself: that de-duplicates a repeated name (which
              # would otherwise race two identical pushes of the same tag)
              # and keeps matrix order identical to the push path.
              for svc in "${DEPLOYABLE[@]}"; do
                if printf '%s\n' "${REQUESTED[@]}" | grep -qxF "$svc"; then
                  SERVICES+=("$svc")
                fi
              done

              # A typo must not silently shrink the deploy set. Reject it here,
              # where the message is readable, instead of letting an unknown
              # name reach the matrix and fail on a missing Dockerfile.
              UNKNOWN=()
              for name in "${REQUESTED[@]}"; do
                if ! printf '%s\n' "${DEPLOYABLE[@]}" | grep -qxF "$name"; then
                  UNKNOWN+=("$name")
                fi
              done
              if [ ${#UNKNOWN[@]} -gt 0 ]; then
                echo "::error::Unknown service(s): ${UNKNOWN[*]}. Deployable: ${DEPLOYABLE[*]}"
                exit 1
              fi
            fi

            # Backstop for the zero-services trap this trigger exists to
            # avoid — e.g. an input of only commas/spaces passes the checks
            # above but selects nothing. A manual run that would build
            # nothing is operator error, so fail loudly rather than go green.
            if [ ${#SERVICES[@]} -eq 0 ]; then
              echo "::error::Input '$REQUESTED_INPUT' selected no services; nothing would be built."
              exit 1
            fi
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

            for svc in "${DEPLOYABLE[@]}"; do
              if echo "$CHANGED_FILES" | grep -q "services/$svc/"; then
                SERVICES+=("$svc")
              fi
            done
          fi

          # An empty matrix is still a valid, expected outcome for a push that
          # touched no service (docs, CI config), and is gated by the
          # `!= '[]'` condition on build-and-push.
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -sc .)
            echo "services=$JSON" >> $GITHUB_OUTPUT
          fi

          echo "Services to build: ${SERVICES[*]:-none}"

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing (OIDC identity token)
      id-token: write

    strategy:
      # One service failing to build must not cancel the other services'
      # images — they are deployed independently.
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          # The build context differs by stack, so it cannot be one value:
          #   * Go Dockerfiles COPY shared/go and services/<svc>/ from the
          #     repo root, so they need the root as context (this is what
          #     go-service.yml does).
          #   * The two .NET Dockerfiles COPY src/... relative to their own
          #     service directory (this is what dotnet-service.yml does).
          # Using services/<svc> for a Go service fails with
          # "/shared/go: not found"; using . for a .NET service fails with
          # "src/Ecommerce.<X>Service/...: not found".
          context: ${{ contains(fromJson('["payment-service","inventory-service"]'), matrix.service) && format('services/{0}', matrix.service) || '.' }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Keyless signing: the signature is bound to this workflow's OIDC
      # identity and recorded in the Rekor transparency log. Enforce at
      # deploy time with a Kyverno/OPA verifyImages policy pinned to
      # this repository's workflow identity.
      - name: Sign image with cosign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
