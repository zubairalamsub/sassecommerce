apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce
  labels: { app: inventory-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata:
      labels: { app: inventory-service }
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/saajan/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8084 }
          envFrom:
            - configMapRef: { name: shared-config }
          env:
            - { name: ASPNETCORE_URLS, value: http://+:8084 }
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: ConnectionStrings__DefaultConnection, value: "Host=postgres;Port=5432;Database=inventory_db;Username=$(DB_USER);Password=$(DB_PASSWORD)" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: Jwt__Secret
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: inventory-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: inventory-service }
  ports:
    - { name: http, port: 8084, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: inventory-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: inventory-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
