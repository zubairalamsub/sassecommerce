name: CI - Cart Service

on:
  push:
    branches: [master, develop]
    paths:
      - 'services/cart-service/**'
      - 'shared/go/**'
      - '.golangci.yml'
      - '.github/workflows/ci-cart-service.yml'
      - '.github/workflows/go-service.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'services/cart-service/**'
      - 'shared/go/**'
      - '.golangci.yml'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/go-service.yml
    with:
      service-name: cart-service
      service-path: services/cart-service
      # Tests are mock-based; no Postgres container needed.
