apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: ecommerce
  labels: { app: shipping-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: shipping-service } }
  template:
    metadata:
      labels: { app: shipping-service }
    spec:
      containers:
        - name: shipping-service
          image: ghcr.io/saajan/shipping-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8086 }
          envFrom:
            - configMapRef: { name: shared-config }
          env:
            - { name: PORT, value: "8086" }
            - { name: DB_HOST, value: postgres }
            - { name: DB_NAME, value: shipping_db }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
            - { name: DEFAULT_CARRIER, value: pathao }
            - { name: MERCHANT_FROM_NAME, value: "Saajan Warehouse" }
            - { name: MERCHANT_FROM_CITY, value: Dhaka }
            - { name: MERCHANT_FROM_COUNTRY, value: BD }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: shipping-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: shipping-service }
  ports:
    - { name: http, port: 8086, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: shipping-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shipping-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
