apiVersion: apps/v1
kind: Deployment
metadata: { name: cart-service, namespace: ecommerce, labels: { app: cart-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: cart-service } }
  template:
    metadata: { labels: { app: cart-service } }
    spec:
      containers:
        - name: cart-service
          image: ghcr.io/saajan/cart-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8089 }]
          envFrom: [{ configMapRef: { name: shared-config } }]
          env:
            - { name: PORT, value: "8089" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-credentials, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: cart-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: cart-service }
  ports: [{ name: http, port: 8089, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: cart-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cart-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
