name: Go Service CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string
      go-version:
        required: false
        type: string
        default: '1.25'
      needs-postgres:
        required: false
        type: boolean
        default: false
      needs-mongodb:
        required: false
        type: boolean
        default: false
      needs-redis:
        required: false
        type: boolean
        default: false
      race:
        # The race detector makes test build+run ~2-10x slower (worst for the
        # CGO/SQLite services). Off by default for fast PR feedback; enable on a
        # nightly/scheduled run or by passing race: true from the caller.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Start PostgreSQL
        if: inputs.needs-postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=${{ inputs.service-name }}_test \
            -p 5432:5432 \
            --health-cmd pg_isready \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 10 \
            postgres:15-alpine
          # Wait for healthy
          until docker inspect --format='{{.State.Health.Status}}' postgres 2>/dev/null | grep -q healthy; do sleep 1; done

      - name: Start MongoDB
        if: inputs.needs-mongodb
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'" \
            --health-interval 3s \
            --health-timeout 3s \
            --health-retries 15 \
            mongo:7
          until docker inspect --format='{{.State.Health.Status}}' mongodb 2>/dev/null | grep -q healthy; do sleep 1; done

      - name: Start Redis
        if: inputs.needs-redis
        run: |
          docker run -d --name redis -p 6379:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 2s \
            --health-timeout 3s \
            --health-retries 15 \
            redis:7-alpine
          until docker inspect --format='{{.State.Health.Status}}' redis 2>/dev/null | grep -q healthy; do sleep 1; done

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.service-path }}/go.sum

      - name: Download dependencies
        working-directory: ${{ inputs.service-path }}
        run: go mod download

      - name: Build
        working-directory: ${{ inputs.service-path }}
        run: go build ./...

      - name: Run tests
        working-directory: ${{ inputs.service-path }}
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: ${{ inputs.service-name }}_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/${{ inputs.service-name }}_test?sslmode=disable
          MONGODB_URI: mongodb://localhost:27017
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          RACE=""
          if [ "${{ inputs.race }}" = "true" ]; then RACE="-race"; fi
          go test -v $RACE -coverprofile=coverage.out -covermode=atomic -timeout 120s ./...

      - name: Coverage summary
        if: always()
        working-directory: ${{ inputs.service-path }}
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-path }}/coverage.out
          retention-days: 14
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.service-path }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@8564da7cb3c6866ed1da648ca8f00a258ef0c802 # v6.5.2
        with:
          version: latest
          working-directory: ${{ inputs.service-path }}
          args: --timeout=5m

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          # Root context: these Dockerfiles COPY shared/go from the repo root.
          context: .
          file: ${{ inputs.service-path }}/Dockerfile
          push: false
          tags: ${{ inputs.service-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
