apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
  labels: { app: product-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: product-service } }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      containers:
        - name: product-service
          image: ghcr.io/saajan/product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8083 }
          envFrom:
            - configMapRef: { name: shared-config }
          env:
            - { name: PORT, value: "8083" }
            - { name: MONGO_DB_NAME, value: product_db }
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: mongodb-credentials, key: uri } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
            # Object storage (image uploads). Endpoint/region/bucket from
            # shared-config; credentials from object-storage-credentials secret.
            - name: OCI_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: access-key } }
            - name: OCI_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: object-storage-credentials, key: secret-key } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: product-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: product-service }
  ports:
    - { name: http, port: 8083, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: product-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: product-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
