apiVersion: apps/v1
kind: Deployment
metadata: { name: vendor-service, namespace: ecommerce, labels: { app: vendor-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: vendor-service } }
  template:
    metadata: { labels: { app: vendor-service } }
    spec:
      containers:
        - name: vendor-service
          image: ghcr.io/saajan/vendor-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8092 }]
          envFrom: [{ configMapRef: { name: shared-config } }]
          env:
            - { name: PORT, value: "8092" }
            - { name: DB_HOST, value: postgres }
            - { name: DB_NAME, value: vendor_db }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: vendor-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: vendor-service }
  ports: [{ name: http, port: 8092, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: vendor-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: vendor-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
