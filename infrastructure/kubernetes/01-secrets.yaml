# Template for shared secrets. Replace placeholder values with `kubectl create
# secret generic ...` before applying, or use sealed-secrets / external-secrets.
# DO NOT commit real values here.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ecommerce
type: Opaque
stringData:
  username: postgres
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: ecommerce
type: Opaque
stringData:
  uri: mongodb://admin:REPLACE_ME@mongodb:27017
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: ecommerce
type: Opaque
stringData:
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: ecommerce
type: Opaque
stringData:
  secret: REPLACE_ME_WITH_LONG_RANDOM_STRING
---
apiVersion: v1
kind: Secret
metadata:
  name: two-factor-encryption-key
  namespace: ecommerce
type: Opaque
stringData:
  # 32-byte hex-encoded AES-256 key
  key: REPLACE_ME_WITH_64_HEX_CHARS
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-providers
  namespace: ecommerce
type: Opaque
stringData:
  sendgrid-api-key: ""
  twilio-account-sid: ""
  twilio-auth-token: ""
  sslwireless-api-token: ""
  sslwireless-sid: ""
  fcm-server-key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-providers
  namespace: ecommerce
type: Opaque
stringData:
  # Bangladesh-first payment gateway placeholders. Wire these up when ready.
  sslcommerz-store-id: ""
  sslcommerz-store-password: ""
  bkash-app-key: ""
  bkash-app-secret: ""
  nagad-merchant-id: ""
  nagad-merchant-private-key: ""
---
# Object storage credentials. Targets Oracle Cloud Object Storage in S3
# compatibility mode; works unchanged for AWS S3 / R2 / MinIO by changing
# OCI_S3_ENDPOINT.
apiVersion: v1
kind: Secret
metadata:
  name: object-storage-credentials
  namespace: ecommerce
type: Opaque
stringData:
  # OCI Customer Secret Key pair (IAM > User > Customer Secret Keys > Generate)
  access-key: REPLACE_ME
  secret-key: REPLACE_ME
