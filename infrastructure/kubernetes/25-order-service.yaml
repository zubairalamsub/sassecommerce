apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, namespace: ecommerce, labels: { app: order-service } }
spec:
  replicas: 3
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      containers:
        - name: order-service
          image: ghcr.io/saajan/order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: shared-config } }]
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: DB_HOST, value: postgres }
            - { name: DB_NAME, value: order_db }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
            - { name: INVENTORY_SERVICE_URL, value: http://inventory-service:8084 }
            - { name: PAYMENT_SERVICE_URL, value: http://payment-service:8085 }
            - { name: SHIPPING_SERVICE_URL, value: http://shipping-service:8086 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1500m, memory: 1Gi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: order-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: order-service }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-service }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
