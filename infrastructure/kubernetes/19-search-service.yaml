apiVersion: apps/v1
kind: Deployment
metadata: { name: search-service, namespace: ecommerce, labels: { app: search-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: search-service } }
  template:
    metadata: { labels: { app: search-service } }
    spec:
      containers:
        - name: search-service
          image: ghcr.io/saajan/search-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8090 }]
          envFrom: [{ configMapRef: { name: shared-config } }]
          env:
            - { name: PORT, value: "8090" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: search-service, namespace: ecommerce }
spec:
  type: ClusterIP
  selector: { app: search-service }
  ports: [{ name: http, port: 8090, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: search-service, namespace: ecommerce }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: search-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
